<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineFlux — Movie details</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='10' y='25' width='80' height='55' rx='10' fill='none' stroke='%23f5b95a' stroke-width='6'/%3E%3Ccircle cx='50' cy='52' r='16' fill='none' stroke='%23f5b95a' stroke-width='6'/%3E%3Crect x='30' y='14' width='16' height='12' rx='3' fill='%23f5b95a'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="scene" aria-hidden="true">
        <div class="bg-video-wrap">
            <video class="bg-video" autoplay muted loop playsinline poster="assets/bg-poster.jpg">
                <source src="assets/bg-video.mp4" type="video/mp4">
            </video>
            <div class="bg-video-overlay"></div>
        </div>
        <div class="glow glow-1"></div>
        <div class="glow glow-2"></div>
        <div class="grain"></div>
    </div>

    <div class="detail-backdrop" id="detailBackdrop" aria-hidden="true"></div>

    <header class="site-header compact">
        <a href="index.html" class="brand">
            <svg class="brand-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 8.5 20 5l1 4-17 3.5z" />
                <path d="M4 12h16v7a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z" />
                <path d="m6 8 3-3M11 7l3-3M16 6l3-3" />
            </svg>
            <span class="brand-name">CineFlux</span>
        </a>

        <div class="header-actions">
            <a href="index.html" class="back-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M19 12H5M11 6l-6 6 6 6" />
                </svg>
                <span>Back to search</span>
            </a>

            <a href="index.html?view=favorites" class="favorites-icon-btn" aria-label="My Favorites">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path
                        d="M12 21s-6.7-4.35-9.3-8.1C1 10.1 1.6 6.7 4.6 5.2c2.4-1.2 5 .1 6.4 2.3 1.4-2.2 4-3.5 6.4-2.3 3 1.5 3.6 4.9 1.9 7.7C18.7 16.65 12 21 12 21z" />
                </svg>
            </a>
        </div>
    </header>

    <main>
        <div id="movie-detail"></div>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 CineFlux. All rights reserved.</p>
    </footer>

    <script src="effects.js"></script>
    <script src="favorites.js"></script>
    <script src="movie-details.js"></script>
</body>
</html>
