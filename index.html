<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CineFlux — Find any film, instantly</title>

    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='10' y='25' width='80' height='55' rx='10' fill='none' stroke='%23f5b95a' stroke-width='6'/%3E%3Ccircle cx='50' cy='52' r='16' fill='none' stroke='%23f5b95a' stroke-width='6'/%3E%3Crect x='30' y='14' width='16' height='12' rx='3' fill='%23f5b95a'/%3E%3C/svg%3E">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <!-- Hero video layout -->
    <style>
        /* HERO SECTION */
        .site-header {
            position: relative;
            z-index: 5;
        }

        .hero-layout {
            width: min(1200px, 92%);
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            align-items: center;
            gap: 60px;
            padding: 70px 0 40px;
        }

        .hero-content {
            min-width: 0;
        }

        .hero-title {
            margin-bottom: 18px;
        }

        .hero-sub {
            max-width: 650px;
            margin-bottom: 0;
        }

        /* VIDEO ON RIGHT */
        .hero-video-card {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 10;
            border-radius: 24px;
            overflow: hidden;
            background: #080808;
            border: 1px solid rgba(255, 255, 255, 0.14);
            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.55),
                0 0 45px rgba(255, 255, 255, 0.06);
            transform: perspective(1000px) rotateY(-4deg);
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }

        .hero-video-card:hover {
            transform: perspective(1000px) rotateY(0deg) translateY(-5px);
            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.65),
                0 0 55px rgba(255, 255, 255, 0.1);
        }

        .hero-video {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }

        /* DARK CINEMATIC OVERLAY */
        .hero-video-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(
                    90deg,
                    rgba(0, 0, 0, 0.28),
                    transparent 50%,
                    rgba(0, 0, 0, 0.2)
                ),
                linear-gradient(
                    0deg,
                    rgba(0, 0, 0, 0.45),
                    transparent 45%
                );
        }

        /* Small film label */
        .hero-video-label {
            position: absolute;
            left: 18px;
            bottom: 18px;
            z-index: 2;
            padding: 8px 13px;
            border-radius: 999px;
            background: rgba(0, 0, 0, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            color: white;
            font-family: "Manrope", sans-serif;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        /* MOBILE */
        @media (max-width: 850px) {
            .hero-layout {
                grid-template-columns: 1fr;
                gap: 35px;
                padding-top: 45px;
            }

            .hero-video-card {
                transform: none;
                max-width: 700px;
                margin: 0 auto;
            }

            .hero-video-card:hover {
                transform: translateY(-3px);
            }
        }

        @media (max-width: 500px) {
            .hero-layout {
                width: 90%;
                padding-top: 30px;
            }

            .hero-video-card {
                border-radius: 18px;
            }

            .hero-video-label {
                font-size: 9px;
                padding: 6px 10px;
            }
        }
    </style>
</head>

<body>

    <!-- BACKGROUND SCENE -->
    <div class="scene" aria-hidden="true">

        <div class="bg-video-wrap">
            <video class="bg-video" autoplay muted loop playsinline poster="assets/bg-poster.jpg">
                <source src="assets/bg-video.mp4" type="video/mp4">
            </video>

            <div class="bg-video-overlay"></div>
        </div>

        <div class="floating-reel">
            <div class="reel-face reel-front"></div>
            <div class="reel-face reel-back"></div>
        </div>

        <div class="glow glow-1"></div>
        <div class="glow glow-2"></div>

        <div class="grain"></div>
    </div>


    <!-- HEADER / HERO -->
    <header class="site-header">

        <div class="hero-layout">

            <!-- LEFT SIDE -->
            <div class="hero-content">

                <div class="brand">
                    <svg class="brand-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M3 8.5 20 5l1 4-17 3.5z" />
                        <path d="M4 12h16v7a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z" />
                        <path d="m6 8 3-3M11 7l3-3M16 6l3-3" />
                    </svg>
                    <span class="brand-name">CineFlux</span>
                </div>

                <h1 class="hero-title">
                    Find any film, instantly.
                </h1>

                <p class="hero-sub">
                    Search the world's movies — posters, ratings, cast and plot
                    in one place.
                </p>

            </div>


            <!-- RIGHT SIDE VIDEO -->
            <div class="hero-video-card">

             <video
              class="hero-video"
              autoplay
              muted
              loop
               playsinline>

               <source src="hero-video.mp4" type="video/mp4">

               Your browser does not support the video tag.
               </video>

                <div class="hero-video-overlay"></div>

                
            </div>

        </div>

    </header>


    <div class="sprocket-row" aria-hidden="true"></div>


    <!-- MAIN -->
    <main>

        <!-- SEARCH -->
        <div class="search-panel">

            <form id="movieForm" action="">

                <input
                    id="movieInput"
                    type="text"
                    placeholder="Search a title… Inception, The Matrix, Interstellar">

                <button type="submit">
                    Search
                </button>

            </form>

        </div>


        <!-- FAVORITES TOGGLE -->
        <div class="quick-actions">

            <button type="button" id="favoritesBtn" class="favorites-toggle">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path
                        d="M12 21s-6.7-4.35-9.3-8.1C1 10.1 1.6 6.7 4.6 5.2c2.4-1.2 5 .1 6.4 2.3 1.4-2.2 4-3.5 6.4-2.3 3 1.5 3.6 4.9 1.9 7.7C18.7 16.65 12 21 12 21z" />
                </svg>
                <span>My Favorites</span>
            </button>

        </div>


        <!-- TRENDING -->
        <div class="trending" aria-label="Try a search">

            <span class="trending-label">
                Try:
            </span>

            <button
                type="button"
                class="chip"
                data-query="Inception">
                Inception
            </button>

            <button
                type="button"
                class="chip"
                data-query="Interstellar">
                Interstellar
            </button>

            <button
                type="button"
                class="chip"
                data-query="The Dark Knight">
                The Dark Knight
            </button>

            <button
                type="button"
                class="chip"
                data-query="Parasite">
                Parasite
            </button>

        </div>


        <!-- MOOD SUGGESTIONS -->
        <div class="mood-panel" aria-label="Pick your mood for suggestions">

            <span class="mood-label">Pick your mood:</span>

            <button type="button" class="mood-btn" data-mood="happy">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="9" />
                    <path d="M8.5 10h.01M15.5 10h.01" />
                    <path d="M8 14.5c1 1.2 2.4 1.8 4 1.8s3-.6 4-1.8" />
                </svg>
                <span>Happy</span>
            </button>

            <button type="button" class="mood-btn" data-mood="sad">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="9" />
                    <path d="M8.5 10h.01M15.5 10h.01" />
                    <path d="M8 16c1-1.2 2.4-1.8 4-1.8s3 .6 4 1.8" />
                </svg>
                <span>Sad</span>
            </button>

            <button type="button" class="mood-btn" data-mood="excited">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M13 2 4 14h6l-1 8 9-12h-6z" />
                </svg>
                <span>Excited</span>
            </button>

            <button type="button" class="mood-btn" data-mood="relaxed">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M3 9c2 0 2-2 4-2s2 2 4 2 2-2 4-2 2 2 4 2" />
                    <path d="M3 15c2 0 2-2 4-2s2 2 4 2 2-2 4-2 2 2 4 2" />
                </svg>
                <span>Relaxed</span>
            </button>

            <button type="button" class="mood-btn" data-mood="scared">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 3 2 20h20z" />
                    <path d="M12 9v5M12 17h.01" />
                </svg>
                <span>Scared</span>
            </button>

            <button type="button" class="mood-btn" data-mood="romantic">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path
                        d="M12 21s-6.7-4.35-9.3-8.1C1 10.1 1.6 6.7 4.6 5.2c2.4-1.2 5 .1 6.4 2.3 1.4-2.2 4-3.5 6.4-2.3 3 1.5 3.6 4.9 1.9 7.7C18.7 16.65 12 21 12 21z" />
                </svg>
                <span>Romantic</span>
            </button>

        </div>


        <!-- FEATURES -->
        <div class="feature-row">

            <div class="feature">
                <svg class="feature-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M13 2 4 14h6l-1 8 9-12h-6z" />
                </svg>
                <span>Instant search</span>
            </div>

            <div class="feature">
                <svg class="feature-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="4" y="4" width="16" height="16" rx="2" />
                    <path d="M8 9h8M8 13h5" />
                </svg>
                <span>Full cast &amp; plot</span>
            </div>

            <div class="feature">
                <svg class="feature-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path
                        d="m12 3 2.6 5.6 6.1.7-4.5 4.2 1.2 6-5.4-3-5.4 3 1.2-6-4.5-4.2 6.1-.7z" />
                </svg>
                <span>IMDb ratings</span>
            </div>

        </div>


        <!-- MOVIE RESULTS -->
        <div id="movieHub">

            <div class="empty-state">

                <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="3" y="6" width="14" height="12" rx="2" />
                    <path d="m17 10 4-2.5v9L17 14" />
                    <path d="M7 6V4M11 6V4" />
                </svg>

                <p>
                    Search for a movie above to see its poster,
                    rating and full details.
                </p>

            </div>

        </div>

    </main>


    <!-- FOOTER -->
    <footer class="site-footer">

        <p>
            &copy; 2026 CineFlux. All rights reserved.
        </p>

    </footer>


    <!-- JAVASCRIPT -->
    <script src="effects.js"></script>
    <script src="favorites.js"></script>
    <script src="script.js"></script>

</body>

</html>
